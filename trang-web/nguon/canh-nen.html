<!-- ===== PHẦN: Cảnh nền theo chủ đề: núi Tây Bắc, trời sao, biển hoàng hôn (3D, có cảnh SVG dự phòng) ===== -->
<style>
@media (prefers-reduced-motion: no-preference) {
  .sao { animation: sao-nhay 6s ease-in-out infinite; animation-delay: var(--d); }
}
.sao { opacity: .5; }
@keyframes sao-nhay {0%, 100% { opacity: .15; } 50% { opacity: .7; }}
@keyframes suong-troi {to { transform: translateX(140px); }}
:root[data-mau="dem-xanh"] body { background: transparent; }
.bau-troi { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
:root[data-mau="dem-xanh"] .bau-troi { display: block; }
.nen-sao { position: absolute; inset: -6% 0; width: 100%; height: 112%; fill: var(--chu); opacity: .55; }
.chom-sao { position: absolute; right: 2vw; top: 12vh; width: min(62vw, 860px); height: auto; }
.chom .net { stroke: var(--do); stroke-width: 1.2; }
.chom .cham { fill: var(--chu); }
.chom text { font: 600 15px var(--f-chu); letter-spacing: .14em; text-transform: uppercase; fill: var(--do); text-anchor: middle; }
.chom.mo { opacity: .28; }
.chom.sang .net { opacity: .55; }
.chom .quang { opacity: .12; }
.chom.sang text { opacity: .9; }
@media (max-width: 900px) {
  .chom-sao { right: -18vw; top: 30vh; width: 130vw; opacity: .6; }
  .chom text { font-size: 20px; }
}
@media (prefers-reduced-motion: no-preference) {
  .nen-sao, .chom-sao { will-change: transform; }
  .nen-sao.lap1 { animation: lap-tam 6s ease-in-out infinite alternate; will-change: transform, opacity; }
  .nen-sao.lap2 { animation: lap-tam 8s ease-in-out -4s infinite alternate; will-change: transform, opacity; }
}
@keyframes lap-tam {from { opacity: .7; } to { opacity: .12; }}
:root[data-mau="reu-suong"] body { background: transparent; }
.dai-ngan { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.dai-ngan .lop { position: absolute; left: 0; width: 200%; bottom: -8vh; height: 112vh; }
.dai-ngan .lop:nth-last-child(-n/**/+3) { will-change: transform; }
.dai-ngan .lop svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.dai-ngan .lop-may { height: calc(112vh * .56); }
@media (prefers-reduced-motion: no-preference) {
  .troi-may { transform-origin: 50% 100%; animation: may-troi var(--v) ease-in-out var(--tre, 0s) infinite alternate, may-tho var(--th) ease-in-out var(--tre, 0s) infinite alternate; }
  .bong-may { animation: bong-troi var(--v) linear var(--tre) infinite; }
  .nang { animation: nang-loang 70s ease-in-out infinite alternate; }
  .soi-suong { animation: suong-boc var(--v) ease-in-out var(--tre) infinite; }
  .dan-chim { animation: chim-bay 64s linear infinite; }
}
@keyframes may-troi {to { translate: -9% 0; }}
@keyframes may-tho {to { scale: 1 1.07; }}
@keyframes bong-troi {from { transform: translateX(-80vw); } to { transform: translateX(130vw); }}
@keyframes nang-loang {from { transform: translate(-20vw, 4vh); } to { transform: translate(30vw, -6vh); }}
@keyframes suong-boc {0% { opacity: 0; transform: translateY(0) scaleX(1); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(-14vh) scaleX(1.8); }}
@keyframes chim-bay {0% { transform: translate(-25vw, 0); opacity: 1; } 45% { transform: translate(110vw, -9vh); opacity: 1; } 45.1%, 100% { transform: translate(110vw, -9vh); opacity: 0; }}
.bong-may { position: absolute; left: 0; width: 70vw; height: 34vh; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, .28), transparent); transform: translateX(-80vw); }
.nang { position: absolute; left: 20vw; top: 22vh; width: 60vw; height: 40vh; border-radius: 50%; background: radial-gradient(closest-side, rgba(var(--chu-rgb), .07), transparent); }
.soi-suong { position: absolute; width: 22vw; height: 7vh; border-radius: 50%; background: radial-gradient(closest-side, rgba(var(--chu-rgb), .1), transparent); opacity: 0; }
.dan-chim { position: absolute; left: 0; top: 24vh; width: clamp(80px, 9vw, 140px); transform: translateX(-25vw); }
.dan-chim svg { width: 100%; height: auto; display: block; overflow: visible; }
@media (prefers-reduced-motion: reduce) {
  .bong-may, .soi-suong, .dan-chim { display: none; }
}
@media (max-width: 700px) {
  .dai-ngan .lop { width: 440%; height: 90vh; bottom: -4vh; }
  .dai-ngan .lop-may { height: calc(90vh * .56); }
  .dai-ngan { opacity: .85; }
}
.nui-3d { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
.dai-ngan.co-3d .nui-3d { display: block; }
.dai-ngan.co-3d > :not(.nui-3d) { display: none; }
.troi-3d { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
.bau-troi.co-3d .troi-3d { display: block; }
.bau-troi.co-3d > :not(.troi-3d) { display: none; }
.bien-chieu { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
.bien-3d { position: absolute; inset: 0; width: 100%; height: 100%; }
.bien-chieu::after { content: ""; position: absolute; inset: 0; background: rgba(var(--nen-rgb), var(--man, .2)); }
:root.co-bien[data-mau="dat-tram"] { background: var(--nen); }
:root.co-bien[data-mau="dat-tram"] body { background: transparent; }
:root:not(.co-bien) .bien-chieu { display: none; }
</style>

"464.0"/><line x1="258.0" y1="464.0" x2="231.1" y2="588.2"/><line x1="231.1" y1="588.2" x2="282.6" y2="600.6"/><line x1="653.0" y1="424.5" x2="521.2" y2="518.2"/></g><g class="cham"><circle class="quang" cx="819.3" cy="468.5" r="12.6"/><circle cx="819.3" cy="468.5" r="4.2"/><circle class="quang" cx="800.8" cy="462.9" r="8.7"/><circle cx="800.8" cy="462.9" r="2.9"/><circle class="quang" cx="653.0" cy="424.5" r="16.5"/><circle cx="653.0" cy="424.5" r="5.5"/><circle class="quang" cx="523.5" cy="364.7" r="16.5"/><circle cx="523.5" cy="364.7" r="5.5"/><circle class="quang" cx="463.6" cy="377.1" r="12.6"/><circle cx="463.6" cy="377.1" r="4.2"/><circle class="quang" cx="449.6" cy="345.5" r="10.7"/><circle cx="449.6" cy="345.5" r="3.6"/><circle class="quang" cx="436.4" cy="361.3" r="12.6"/><circle cx="436.4" cy="361.3" r="4.2"/><circle class="quang" cx="411.4" cy="362.4" r="10.7"/><circle cx="411.4" cy="362.4" r="3.6"/><circle class="quang" cx="481.8" cy="449.4" r="10.7"/><circle cx="481.8" cy="449.4" r="3.6"/><circle class="quang" cx="346.2" cy="447.1" r="12.6"/><circle cx="346.2" cy="447.1" r="4.2"/><circle class="quang" cx="357.6" cy="514.8" r="9.5"/><circle cx="357.6" cy="514.8" r="3.2"/><circle class="quang" cx="338.6" cy="539.7" r="14.5"/><circle cx="338.6" cy="539.7" r="4.8"/><circle class="quang" cx="521.2" cy="518.2" r="9.5"/><circle cx="521.2" cy="518.2" r="3.2"/><circle class="quang" cx="264.0" cy="429.0" r="10.7"/><circle cx="264.0" cy="429.0" r="3.6"/><circle class="quang" cx="258.0" cy="464.0" r="10.7"/><circle cx="258.0" cy="464.0" r="3.6"/><circle class="quang" cx="231.1" cy="588.2" r="10.7"/><circle cx="231.1" cy="588.2" r="3.6"/><circle class="quang" cx="282.6" cy="600.6" r="10.7"/><circle cx="282.6" cy="600.6" r="3.6"/></g></g></svg></div>
<script>
/* ===================================================================
   CẢNH NỀN THEO CHỦ ĐỀ — mỗi chủ đề đăng ký một cảnh trong CANH (thêm chủ đề = thêm một mục)
   - Cảnh 3D chỉ chạy khi đang ở đúng chủ đề và tab đang mở; mã Three.js chỉ được nạp lần đầu cần dùng.
   - Rời chủ đề: dừng vẽ ngay; quá 20 giây chưa quay lại thì giải phóng bộ nhớ đồ hoạ (quay lại sẽ dựng lại).
   - Máy không chạy được WebGL: giữ cảnh SVG dự phòng (cũng trôi nhẹ theo cuộn).
   =================================================================== */
(() => {
  const { ghi, ST, GIAM } = TK, goc = document.documentElement;
  const tienDo = () => scrollY / Math.max(1, goc.scrollHeight - innerHeight);
  const mau = (k) => getComputedStyle(goc).getPropertyValue(k).trim();
  const chayMa = (id) => { const s = document.createElement('script'); s.textContent = document.getElementById(id).textContent; document.head.appendChild(s); };
  const MAY = matchMedia('(pointer: fine)').matches;
  const GIU_TOI_DA = window.__thuGiuCanh || 20000;   // ms giữ cảnh đã dừng trước khi giải phóng (bài thử đặt ngắn hơn)

  const CANH = {
    'reu-suong': {   // núi Tây Bắc, mây sương
      vo: document.querySelector('.dai-ngan'), ma: 'ma-canh-3d', ten: 'núi 3D',
      tao: (cv) => window.canhNui && window.canhNui(cv, { nen: mau('--nen'), may: mau('--chu'), nui: mau('--do'), nhan: mau('--do') }),
      cuon: () => tienDo(),
      svg: (vo) => {   // lớp núi gần trượt nhiều, lớp xa trượt ít
        const lop = [...vo.querySelectorAll('.lop')].map((e) => [e, parseFloat(e.style.getPropertyValue('--k')) || 0]);
        return () => { const t = tienDo(); lop.forEach(([e, k]) => { e.style.transform = `translate3d(${(-t * 46.9 * k).toFixed(2)}%,0,0)`; }); };
      },
    },
    'dem-xanh': {   // trời sao, chòm Bảo Bình
      vo: document.querySelector('.bau-troi'), ma: 'ma-troi-3d', ten: 'trời sao 3D',
      tao: (cv) => window.bauTroi && window.bauTroi(cv, 'binh-yen', { nen: mau('--nen'), nhan: mau('--do'), chu: mau('--chu') }),
      svg: (vo) => {   // sao xa trôi ít, chòm sao trôi nhiều hơn
        const xa = [...vo.querySelectorAll('.nen-sao')], chom = vo.querySelector('.chom-sao');
        return () => { const y = -scrollY * 0.02; xa.forEach((e) => { e.style.transform = `translate3d(0,${y.toFixed(1)}px,0)`; }); chom.style.transform = `translate3d(0,${(y * 1.6).toFixed(1)}px,0)`; };
      },
    },
    'dat-tram': {   // hoàng hôn trên biển: mặt trời lặn theo cuộn, chìm hẳn khi phần Liên hệ lên giữa màn hình
      vo: document.querySelector('.bien-chieu'), ma: 'ma-bien-3d', ten: 'biển 3D', lopGoc: 'co-bien',
      tao: (cv) => window.canhBien && window.canhBien(cv, { nen: mau('--nen') }),
      theoST: { trigger: document.body, start: 'top top', endTrigger: '#lien-he', end: 'top 50%' },
      khiCuon: (vo, p) => vo.style.setProperty('--man', Math.min(0.6, 0.22 + p * 2.4).toFixed(3)),
    },
  };

  const tao = (k, c) => {
    if (c.hong) return null;
    const cv = c.vo.querySelector('canvas');
    try { if (!window.THREE) chayMa('ma-three'); if (!c.daNap) { chayMa(c.ma); c.daNap = true; } c.canh = c.tao(cv); }
    catch (e) { c.canh = null; ghi('LỖI', c.ten + ': ' + e.message); }
    if (!c.canh) { c.hong = true; ghi(c.ten, 'máy không chạy được WebGL, dùng cảnh SVG'); return null; }
    c.vo.classList.add('co-3d'); ghi(c.ten, 'bật');
    if (c.cuon) c.canh.cuon(c.cuon());
    if (c.theoST && !c.daST) {   // gắn một lần; luôn gọi cảnh hiện tại (kể cả khi được dựng lại)
      c.daST = true; const cap = (p) => { c.p = p; if (c.canh) c.canh.cuon(p); if (c.khiCuon) c.khiCuon(c.vo, p); };
      if (ST) ST.create({ ...c.theoST, onUpdate: (t) => cap(t.progress), onRefresh: (t) => cap(t.progress) });
      else addEventListener('scroll', () => cap(tienDo()), { passive: true });
    } else if (c.theoST && c.p != null) c.canh.cuon(c.p);
    return c.canh;
  };
  const giaiPhong = (c) => {
    if (!c.canh) return;
    try { c.canh.huy(); } catch (e) { ghi('LỖI', 'giải phóng ' + c.ten + ': ' + e.message); }
    c.canh = null; c.vo.classList.remove('co-3d');
    const cv = c.vo.querySelector('canvas'); cv.replaceWith(cv.cloneNode(false));   // canvas đã mất ngữ cảnh đồ hoạ, thay bằng cái mới
    ghi('cảnh-nền', 'giải phóng ' + c.ten);
  };
  const capNhat = () => {
    for (const [k, c] of Object.entries(CANH)) {
      const dung = goc.dataset.mau === k && !document.hidden;
      if (c.lopGoc) goc.classList.toggle(c.lopGoc, dung || (!!c.canh && goc.dataset.mau === k));
      if (dung) { clearTimeout(c.henHuy); c.canh ? c.canh.chay() : tao(k, c); }
      else if (c.canh) { c.canh.dung(); clearTimeout(c.henHuy); if (goc.dataset.mau !== k) c.henHuy = setTimeout(() => giaiPhong(c), GIU_TOI_DA); }
    }
  };
  capNhat();
  new MutationObserver(capNhat).observe(goc, { attributes: true, attributeFilter: ['data-mau'] });
  document.addEventListener('visibilitychange', capNhat);

  // cuộn + chuột: chỉ báo cho cảnh đang chạy; cảnh SVG dự phòng trôi theo cuộn
  for (const c of Object.values(CANH)) if (c.svg && !GIAM) c.capSvg = c.svg(c.vo);
  let hen = 0;
  addEventListener('scroll', () => {
    if (hen) return;
    hen = requestAnimationFrame(() => {
      hen = 0; const c = CANH[goc.dataset.mau]; if (!c) return;
      if (c.canh && c.cuon) c.canh.cuon(c.cuon());
      if (!c.canh && c.capSvg) c.capSvg();
    });
  }, { passive: true });
  if (MAY) addEventListener('pointermove', (e) => { const c = CANH[goc.dataset.mau]; if (c && c.canh && c.canh.chuot) c.canh.chuot(e.clientX / innerWidth - 0.5, e.clientY / innerHeight - 0.5); }, { passive: true });
})();
</script>
