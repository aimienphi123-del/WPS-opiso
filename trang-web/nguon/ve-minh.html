<!-- ===== PHẦN: Về mình: đoạn chữ sáng dần theo tay cuộn, thông tin ngắn ===== -->
<style>
.ve-minh { max-width: 1100px; }
.sang-dan { font: 500 clamp(26px, 3.6vw, 48px)/1.3 var(--f-chu); color: var(--chu); letter-spacing: -.01em; text-wrap: pretty; }
.sang-dan .tw { padding: 0; margin: 0; overflow: visible; }
.sang-dan .twi { color: var(--mo); transition: color .25s; }
.sang-dan .twi.sang { color: var(--chu); }
.thong-tin { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--vien); }
.thong-tin dt { color: var(--do); }
.thong-tin dd { margin: 4px 0 0; color: var(--chu); font-size: 17px; }
@media (max-width: 760px) {
  .thong-tin { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  .sang-dan .twi { color: var(--chu); }
}
</style>
<!-- @khung -->
<section class="phan khung" id="ve-minh" aria-labelledby="h-vm">
    <div class="ve-minh">
      <div class="dau-phan"><h2 class="h2-nho" id="h-vm">Về mình</h2></div>
      <p class="sang-dan" id="sang-dan" data-tach="tu">Mình tên Khanh, đang học Digital Marketing tại Arena Multimedia, sống và làm việc ở TP. Hồ Chí Minh. Kinh nghiệm còn ít nên ngày nào mình cũng học thêm AI với Claude, Gemini và ChatGPT.</p>
      <dl class="thong-tin">
        <div><dt class="ma">Nơi sống</dt><dd>TP. Hồ Chí Minh</dd></div>
        <div><dt class="ma">Tuổi</dt><dd>23</dd></div>
        <div><dt class="ma">Quê quán</dt><dd>Tân Lạc, Phú Thọ</dd></div>
        <div><dt class="ma">Dân tộc</dt><dd>Mường</dd></div>
      </dl>
    </div>
  </section>
<script>
(() => {
  const { $, el, ghi, G, ST, GIAM, CO_DONG, tach, daTach, lenis, cuonToi, dtNho, nhanTT, khiSan } = TK;
  khiSan(function sangDan() {
    if (!CO_DONG) { document.querySelectorAll('#sang-dan .twi').forEach((w) => w.classList.add('sang')); return; }
    const tu = daTach.get($('#sang-dan')).tu;
    const sang = (p) => { const n = p * tu.length * 1.15; tu.forEach((w, i) => { w.classList.toggle('sang', i < n); }); };
    ST.create({ trigger: '#ve-minh', start: 'top 75%', end: 'bottom 60%', onUpdate: (t) => sang(t.progress), onRefresh: (t) => sang(t.progress) });
  });
})();
</script>
